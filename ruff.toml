target-version = "py312"
line-length = 88

[lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "D", "RUF"]

[lint.pydocstyle]
convention = "pep257"

[format]
docstring-code-format = false

[lint.per-file-ignores]
# eventlet monkey-patches before any other import
"src/neutron_bsdbridge/l2_agent/agent.py" = ["E402", "UP031"]
"src/neutron_bsdbridge/dhcp_agent/agent.py" = ["E402", "UP031"]
"src/neutron_bsdbridge/l3_agent/agent.py" = ["E402", "UP031"]
"src/neutron_bsdbridge/mech.py" = ["UP031"]
"src/neutron_bsdbridge/l2_agent/port_config.py" = ["UP031"]
"tests/*" = ["D1", "E402", "B904", "RUF100", "RUF012"]
